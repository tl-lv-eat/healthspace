# Copy to config.yaml (gitignored) and adjust secrets for local use.
# LLM api_key can also be set via DASHSCOPE_API_KEY.

llm:
  provider: maas
  model: qwen3.8-27b
  api_key: "your-api-key-here"
  enable_thinking: false

app:
  jwt_secret: change-me-in-production
  jwt_expire_hours: 720
  database_url: sqlite:///./data/jianfei.db
  upload_dir: uploads/meals
  points:
    daily_all_three: 10
    weekly_plan_complete: 50
    goal_complete: 20
  schedule:
    daily_report_hour: 22
    daily_report_minute: 0
    weekly_report_weekday: 0
    weekly_report_hour: 0
    weekly_report_minute: 30
    reminder_hours: [12, 21]
  users:
    - id: dragon
      password: dragon-pass
      display_name: "龙龙"
      default_water_ml: 2000
      role: member
    - id: leaf
      password: leaf-pass
      display_name: "孙孙"
      default_water_ml: 2000
      role: member
